<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description"
        content="SpectraRig — your ultimate destination for gaming gear, laptops, monitors, chairs, and accessories. Power up your setup with premium tech built for performance." />
    <meta name="keywords"
        content="gaming, tech, laptops, monitors, chairs, accessories, setups, SpectraRig, online store, gaming equipment" />
    <meta name="author" content="Bernadette Brits" />
    <title>SpectraRig | Checkout</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <header>
        <!-- Same header as before -->
    </header>

    <main>
        <section class="checkout">
            <div class="container">
                <h2>Checkout</h2>

                <!-- Cart Items Display -->
                <div id="checkout-items" class="checkout-items"></div>

                <!-- Delivery Notice -->
                <div id="delivery-notice" class="delivery-notice"></div>

                <!-- Summary Section -->
                <div class="summary-box">
                    <h3>Order Summary</h3>
                    <div class="summary">
                        <p>Subtotal: <span id="summary-subtotal">R0.00</span></p>
                        <p>Delivery: <span id="summary-delivery">R0.00</span></p>
                        <hr />
                        <p>
                            <strong>Total: <span id="summary-total">R0.00</span></strong>
                        </p>
                    </div>
                </div>

                <!-- Checkout Form -->
                <form id="checkoutForm" class="checkout-form">
                    <h3>Delivery Details</h3>

                    <input type="text" id="name" name="name" placeholder="Full Name" required />
                    <input type="email" id="email" name="email" placeholder="Email" required />

                    <select id="checkoutAddress" required></select>

                    <button type="button" id="addNewAddressBtn">+ Add New Address</button>
                    <div id="newAddressForm" style="display:none;">
                        <input type="text" id="addressLine1" placeholder="Address Line 1" />
                        <input type="text" id="addressLine2" placeholder="Address Line 2 (Optional)" />
                        <input type="text" id="city" placeholder="City" />
                        <input type="text" id="postalCode" placeholder="Postal Code" />
                        <button type="button" id="saveAddressBtn">Save Address</button>
                    </div>

                    <input type="text" id="phone" name="phone" placeholder="Phone Number" required />

                    <h3 class="payment-head">Payment Method</h3>
                    <div class="payment-options">
                        <label><input type="radio" name="payment" value="Card" required /> Card</label>
                        <label><input type="radio" name="payment" value="EFT" /> EFT</label>
                        <label><input type="radio" name="payment" value="Cash on Delivery" /> Cash on Delivery</label>
                    </div>

                    <button type="submit" class="btn-primary mobile-btn">Place Order</button>
                </form>
            </div>
        </section>
    </main>

    <footer>
        <!-- Same footer as before -->
    </footer>

    <script src="js/main.js"></script>
    <script src="js/mobile-top-nav.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/checkout.js"></script>
    <script src="js/shop.js"></script>
</body>
</html>

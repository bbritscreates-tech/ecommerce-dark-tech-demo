<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Account | SpectraRig</title>
  <link rel="stylesheet" href="style.css" />
  <script src="js/account.js" defer></script>
</head>
<body>

<div class="account-container">

  <!-- === Tabs Buttons === -->
  <div class="account-tabs">
    <button class="account-tab-btn active" data-tab="profileTab">Profile</button>
    <button class="account-tab-btn" data-tab="ordersTab">Orders</button>
    <button class="account-tab-btn" data-tab="settingsTab">Settings</button>
    <button class="account-tab-btn" data-tab="addressesTab">Addresses</button>
  </div>

  <!-- === Profile Tab === -->
  <div id="profileTab" class="account-tab-content active">
    <h3>Your Profile</h3>

    <label for="accountName">Name</label>
    <input type="text" id="accountName" />

    <label for="accountEmail">Email</label>
    <input type="email" id="accountEmail" />

    <button id="updateAccountBtn">Update Profile</button>
  </div>

  <!-- === Orders Tab === -->
  <div id="ordersTab" class="account-tab-content">
    <h3>Your Orders</h3>
    <div id="ordersContainer">
      <p>No orders have been placed yet.</p>
    </div>
  </div>

  <!-- === Settings Tab === -->
  <div id="settingsTab" class="account-tab-content">
    <h3>Change Password</h3>

    <label for="oldPassword">Old Password</label>
    <input type="password" id="oldPassword" />

    <label for="newPassword">New Password</label>
    <input type="password" id="newPassword" />

    <button id="changePasswordBtn">Change Password</button>

    <hr />

    <button id="logoutBtn">Log Out</button>
    <button id="deleteAccountBtn" class="danger">Delete Account</button>
  </div>

  <!-- === Addresses Tab === -->
  <div id="addressesTab" class="account-tab-content">
    <h3>Your Addresses</h3>

    <label for="addressSelect">Saved Addresses</label>
    <select id="addressSelect">
      <option value="" disabled selected>Select an address</option>
    </select>

    <label for="newAddress">Add New Address</label>
    <input type="text" id="newAddress" />

    <button id="addAddressBtn">Add Address</button>
  </div>

</div>

</body>
</html>
